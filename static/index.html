<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salary Calculator</title>
  <script>
    /* Set the theme before first paint to avoid a flash. */
    (function () {
      try {
        var choice = localStorage.getItem("salarycalc-theme") || "system";
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.themeChoice = choice;
        document.documentElement.dataset.theme = choice === "system" ? (dark ? "dark" : "light") : choice;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-orbs"><span></span><span></span><span></span></div>

  <!-- sign-in / first-run screens are rendered here -->
  <div id="authRoot"></div>

  <div class="app hidden" id="appRoot">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">₹</div>
        <div class="brand-text">
          <h1>Salary Calculator</h1>
          <p>Offline · SQLite edition</p>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-item active" data-view="calculator" data-label="Calculator"><span class="ic">🧮</span><span class="label">Calculator</span></div>
        <div class="nav-item" data-view="records" data-label="Saved Records"><span class="ic">🗂️</span><span class="label">Saved Records</span></div>
        <div class="nav-item" data-view="masters" data-label="Masters"><span class="ic">🌍</span><span class="label">Masters</span></div>
        <div class="nav-item" data-view="settings" data-label="Statutory Rules"><span class="ic">⚙️</span><span class="label">Statutory Rules</span></div>
        <div class="nav-item admin-only hidden" data-view="users" data-label="Users &amp; Access"><span class="ic">👥</span><span class="label">Users &amp; Access</span></div>
        <div class="nav-item admin-only hidden" data-view="backup" data-label="Backup &amp; restore"><span class="ic">💾</span><span class="label">Backup &amp; restore</span></div>
      </nav>

      <div class="nav-spacer"></div>
      <div class="sidebar-foot">
        <div class="hint">
          Data is stored in <b>salary.db</b> next to the app.<br />
          Everything works without internet.
        </div>
        <div class="version" id="appVersion">v—</div>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <button class="icon-btn" id="sidebarToggle" title="Collapse or expand the menu" aria-label="Toggle menu">☰</button>
        <div class="titles">
          <h2 id="pageTitle">Calculator</h2>
          <div class="sub" id="pageSub"></div>
        </div>
        <div class="grow"></div>
        <div class="seg theme-switch" id="themeSwitch" role="group" aria-label="Theme">
          <button type="button" data-theme-set="system" title="Follow the system setting">🖥️ System</button>
          <button type="button" data-theme-set="light" title="Light theme">☀️ Light</button>
          <button type="button" data-theme-set="dark" title="Dark theme">🌙 Dark</button>
        </div>
        <div id="topActions" class="btn-row"></div>
        <div class="user-menu" id="userMenu"></div>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts"></div>

  <script src="/static/app.js"></script>
</body>
</html>
